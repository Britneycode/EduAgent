<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f4ed" stop-opacity="0.96"/>
      <stop offset="48%" stop-color="#f5f4ed" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#f5f4ed" stop-opacity="0.24"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <image href="../images/cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#coverScrim)"/>
    <rect x="0" y="0" width="1280" height="10" fill="#c96442"/>
  </g>
  <g id="hero-title">
    <text x="68" y="156" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#c96442" font-weight="700">智能体应用演示</text>
    <text x="68" y="248" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="70" fill="#141413" font-weight="800">EduAgent</text>
    <text x="68" y="322" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="44" fill="#141413" font-weight="800">个性化多 Agent 学习系统</text>
    <text x="72" y="374" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5e5d59">
      <tspan x="72" dy="0">把单轮 AI 问答升级为面向学习全过程的</tspan>
      <tspan x="72" dy="36" fill="#c96442" font-weight="700">智能学习中枢</tspan>
    </text>
  </g>
  <g id="proof-tags">
    <rect x="72" y="470" width="170" height="50" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <circle cx="98" cy="495" r="8" fill="#c96442"/>
    <text x="122" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">LLM Wiki</text>
    <rect x="260" y="470" width="190" height="50" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <circle cx="286" cy="495" r="8" fill="#1565C0"/>
    <text x="310" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">多 Agent 协同</text>
    <rect x="468" y="470" width="190" height="50" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <circle cx="494" cy="495" r="8" fill="#6b8e6b"/>
    <text x="518" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">8 维画像</text>
    <rect x="676" y="470" width="220" height="50" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <circle cx="702" cy="495" r="8" fill="#b07d62"/>
    <text x="726" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">多模态资源闭环</text>
  </g>
  <g id="takeaway">
    <rect x="72" y="565" width="560" height="82" rx="8" fill="#30302e"/>
    <text x="100" y="600" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">核心判断</text>
    <text x="100" y="630" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff">
      <tspan x="100" dy="0">以知识中枢固定事实边界，以智能体协同完成学习闭环。</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="72" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 多 Agent 学习系统 | 2026</text>
    <text x="1208" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">01</text>
  </g>
