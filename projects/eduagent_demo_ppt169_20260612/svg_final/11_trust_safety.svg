<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed" />
    <rect x="0" y="0" width="1280" height="8" fill="#c96442" />
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">可信输出来自检索约束、引用核验和安全过滤的组合防线</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">三段防线：RAG 检索 → sources/confidence → 安全护栏/本地规则/eval。</text>
  </g>
  <g id="defense-pre">
    <path fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" d="M64,150 H410 A8,8 0 0 1 418,158 V392 A8,8 0 0 1 410,400 H64 A8,8 0 0 1 56,392 V158 A8,8 0 0 1 64,150 Z" />
    <path fill="#1565C0" d="M60,150 H414 A4,4 0 0 1 418,154 V154 A4,4 0 0 1 414,158 H60 A4,4 0 0 1 56,154 V154 A4,4 0 0 1 60,150 Z" />
    <circle cx="108" cy="210" r="28" fill="#1565C0" fill-opacity="0.12" />
    <path d="M94,210 L122,210 M108,196 L108,224 M98,200 L118,220 M118,200 L98,220" stroke="#1565C0" stroke-width="3" />
    <text x="154" y="205" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#141413" font-weight="800">生成前：RAG 检索</text>
    <text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="90" y="270">先从课程 Wiki 检索相关片段，</text><text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="90" y="300">再由 Agent 组织讲解与题目。</text><path fill="#ffffff" stroke="#e8e6dc" stroke-width="1" d="M98,342 H368 A8,8 0 0 1 376,350 V368 A8,8 0 0 1 368,376 H98 A8,8 0 0 1 90,368 V350 A8,8 0 0 1 98,342 Z" />
    <text x="233" y="365" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">减少“凭空编教材”的空间</text>
  </g>
  <g id="defense-during">
    <path fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" d="M467,150 H813 A8,8 0 0 1 821,158 V392 A8,8 0 0 1 813,400 H467 A8,8 0 0 1 459,392 V158 A8,8 0 0 1 467,150 Z" />
    <path fill="#6b8e6b" d="M463,150 H817 A4,4 0 0 1 821,154 V154 A4,4 0 0 1 817,158 H463 A4,4 0 0 1 459,154 V154 A4,4 0 0 1 463,150 Z" />
    <circle cx="511" cy="210" r="28" fill="#6b8e6b" fill-opacity="0.12" />
    <path d="M498,202 L522,202 L522,220 L498,220 Z" fill="none" stroke="#6b8e6b" stroke-width="3" />
    <path d="M504,208 L516,208 M504,214 L518,214" stroke="#6b8e6b" stroke-width="2" />
    <text x="557" y="205" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#141413" font-weight="800">生成中：sources/confidence</text>
    <text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="493" y="270">资源携带 sources、confidence</text><text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="493" y="300">和来源片段，便于回到 Wiki 核对。</text><path fill="#ffffff" stroke="#e8e6dc" stroke-width="1" d="M501,342 H771 A8,8 0 0 1 779,350 V368 A8,8 0 0 1 771,376 H501 A8,8 0 0 1 493,368 V350 A8,8 0 0 1 501,342 Z" />
    <text x="636" y="365" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">低置信内容显式提示</text>
  </g>
  <g id="defense-post">
    <path fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" d="M870,150 H1216 A8,8 0 0 1 1224,158 V392 A8,8 0 0 1 1216,400 H870 A8,8 0 0 1 862,392 V158 A8,8 0 0 1 870,150 Z" />
    <path fill="#c96442" d="M866,150 H1220 A4,4 0 0 1 1224,154 V154 A4,4 0 0 1 1220,158 H866 A4,4 0 0 1 862,154 V154 A4,4 0 0 1 866,150 Z" />
    <circle cx="914" cy="210" r="28" fill="#c96442" fill-opacity="0.12" />
    <path d="M900,200 L914,194 L928,200 L928,214 C928,226 920,232 914,236 C908,232 900,226 900,214 Z" fill="none" stroke="#c96442" stroke-width="3" />
    <path d="M906,215 L912,221 L924,207" fill="none" stroke="#c96442" stroke-width="3" />
    <text x="960" y="205" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#141413" font-weight="800">生成后：安全 + eval</text>
    <text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="896" y="270">讯飞安全护栏与本地规则</text><text font-size="18" fill="#5e5d59" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="896" y="300">共同拦截风险和不合规内容。</text><path fill="#ffffff" stroke="#e8e6dc" stroke-width="1" d="M904,342 H1174 A8,8 0 0 1 1182,350 V368 A8,8 0 0 1 1174,376 H904 A8,8 0 0 1 896,368 V350 A8,8 0 0 1 904,342 Z" />
    <text x="1039" y="365" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">教学场景安全可控</text>
  </g>
  <g id="eval-strip">
    <path fill="#30302e" d="M64,446 H1216 A8,8 0 0 1 1224,454 V590 A8,8 0 0 1 1216,598 H64 A8,8 0 0 1 56,590 V454 A8,8 0 0 1 64,446 Z" />
    <text x="92" y="494" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="800">自动评测基线</text>
    <text x="92" y="528" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#ffffff">离线 eval 覆盖画像抽取、路由、RAG 命中、题目结构、安全规则与结构质量。</text>
    <g id="eval-items">
      <path fill="#faf9f5" d="M100,558 H246 A8,8 0 0 1 254,566 V584 A8,8 0 0 1 246,592 H100 A8,8 0 0 1 92,584 V566 A8,8 0 0 1 100,558 Z" />
      <text x="173" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">画像抽取</text>
      <path fill="#faf9f5" d="M280,558 H426 A8,8 0 0 1 434,566 V584 A8,8 0 0 1 426,592 H280 A8,8 0 0 1 272,584 V566 A8,8 0 0 1 280,558 Z" />
      <text x="353" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">路由判断</text>
      <path fill="#faf9f5" d="M460,558 H606 A8,8 0 0 1 614,566 V584 A8,8 0 0 1 606,592 H460 A8,8 0 0 1 452,584 V566 A8,8 0 0 1 460,558 Z" />
      <text x="533" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">RAG 命中</text>
      <path fill="#faf9f5" d="M640,558 H786 A8,8 0 0 1 794,566 V584 A8,8 0 0 1 786,592 H640 A8,8 0 0 1 632,584 V566 A8,8 0 0 1 640,558 Z" />
      <text x="713" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">题目结构</text>
      <path fill="#faf9f5" d="M820,558 H966 A8,8 0 0 1 974,566 V584 A8,8 0 0 1 966,592 H820 A8,8 0 0 1 812,584 V566 A8,8 0 0 1 820,558 Z" />
      <text x="893" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">内容安全</text>
      <path fill="#faf9f5" d="M1000,558 H1146 A8,8 0 0 1 1154,566 V584 A8,8 0 0 1 1146,592 H1000 A8,8 0 0 1 992,584 V566 A8,8 0 0 1 1000,558 Z" />
      <text x="1073" y="581" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">结构质量</text>
    </g>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 可信与安全</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">11</text>
