    <text x="228" y="324" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">已实现资源</text>
    <text x="136" y="362" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">讲义 / 导图 / 题目 / 代码 / 拓展阅读</text>
    <rect x="678" y="280" width="490" height="112" rx="12" fill="#ffffff" stroke="#e8dfd1" />
