    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">讯飞星火、RAG、知识图谱、多智能体、安全/TTS 与视觉资产辅助共同服务教学闭环。</text>
