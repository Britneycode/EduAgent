<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed" />
    <rect x="0" y="0" width="1280" height="8" fill="#c96442" />
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">EduAgent 已覆盖核心要求，并保留清晰的增强路径</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">当前系统可展示核心学习链路，视频导出、OCR、课程扩展和生产存储作为后续增强。</text>
  </g>
  <g id="coverage-matrix">
    <path fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" d="M64,136 H778 A8,8 0 0 1 786,144 V568 A8,8 0 0 1 778,576 H64 A8,8 0 0 1 56,568 V144 A8,8 0 0 1 64,136 Z" />
    <text x="90" y="182" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#141413" font-weight="800">比赛需求覆盖</text>
    <g id="matrix-header">
      <path fill="#30302e" d="M98,210 H736 A8,8 0 0 1 744,218 V240 A8,8 0 0 1 736,248 H98 A8,8 0 0 1 90,240 V218 A8,8 0 0 1 98,210 Z" />
      <text x="122" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700">要求</text>
      <text x="548" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700">状态</text>
      <text x="646" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700">证据</text>
    </g>
    <g id="row-1">
      <text x="122" y="278" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">多智能体协同</text>
      <path fill="#6b8e6b" d="M538,258 H592 A8,8 0 0 1 600,266 V278 A8,8 0 0 1 592,286 H538 A8,8 0 0 1 530,278 V266 A8,8 0 0 1 538,258 Z" />
      <text x="565" y="278" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="278" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">LangGraph+10</text>
    </g>
    <line x1="90" y1="302" x2="744" y2="302" stroke="#e8e6dc" stroke-width="1" />
    <g id="row-2">
      <text x="122" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">不少于 6 维学生画像</text>
      <path fill="#6b8e6b" d="M538,312 H592 A8,8 0 0 1 600,320 V332 A8,8 0 0 1 592,340 H538 A8,8 0 0 1 530,332 V320 A8,8 0 0 1 538,312 Z" />
      <text x="565" y="332" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">8 维动态画像</text>
    </g>
    <line x1="90" y1="356" x2="744" y2="356" stroke="#e8e6dc" stroke-width="1" />
    <g id="row-3">
      <text x="122" y="386" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">5 类以上学习资源</text>
      <path fill="#6b8e6b" d="M538,366 H592 A8,8 0 0 1 600,374 V386 A8,8 0 0 1 592,394 H538 A8,8 0 0 1 530,386 V374 A8,8 0 0 1 538,366 Z" />
      <text x="565" y="386" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="386" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">8 类资源生成</text>
    </g>
    <line x1="90" y1="410" x2="744" y2="410" stroke="#e8e6dc" stroke-width="1" />
    <g id="row-4">
      <text x="122" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">个性化路径与辅导</text>
      <path fill="#6b8e6b" d="M538,420 H592 A8,8 0 0 1 600,428 V440 A8,8 0 0 1 592,448 H538 A8,8 0 0 1 530,440 V428 A8,8 0 0 1 538,420 Z" />
      <text x="565" y="440" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">路径服务 + Tutor</text>
    </g>
    <line x1="90" y1="464" x2="744" y2="464" stroke="#e8e6dc" stroke-width="1" />
    <g id="row-5">
      <text x="122" y="494" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">学习效果评估</text>
      <path fill="#6b8e6b" d="M538,474 H592 A8,8 0 0 1 600,482 V494 A8,8 0 0 1 592,502 H538 A8,8 0 0 1 530,494 V482 A8,8 0 0 1 538,474 Z" />
      <text x="565" y="494" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="494" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">测验/错题/接口</text>
    </g>
    <line x1="90" y1="518" x2="744" y2="518" stroke="#e8e6dc" stroke-width="1" />
    <g id="row-6">
      <text x="122" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413">防幻觉与安全</text>
      <path fill="#6b8e6b" d="M538,528 H592 A8,8 0 0 1 600,536 V548 A8,8 0 0 1 592,556 H538 A8,8 0 0 1 530,548 V536 A8,8 0 0 1 538,528 Z" />
      <text x="565" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">完成</text>
      <text x="646" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">RAG 引用 + 护栏</text>
    </g>
  </g>
  <g id="roadmap-panel">
    <path fill="#30302e" d="M830,136 H1216 A8,8 0 0 1 1224,144 V568 A8,8 0 0 1 1216,576 H830 A8,8 0 0 1 822,568 V144 A8,8 0 0 1 830,136 Z" />
    <text x="858" y="184" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="800">后续增强路径</text>
    <g id="roadmap-1">
      <circle cx="878" cy="242" r="9" fill="#c96442" />
      <text x="904" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">完整视频导出增强</text>
      <text x="904" y="274" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff">基于脚本、字幕、旁白包继续自动化。</text>
    </g>
    <g id="roadmap-2">
      <circle cx="878" cy="326" r="9" fill="#1565C0" />
      <text x="904" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">OCR 与资料解析增强</text>
      <text x="904" y="358" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff">覆盖更多课件、扫描件和手写题型。</text>
    </g>
    <g id="roadmap-3">
      <circle cx="878" cy="410" r="9" fill="#6b8e6b" />
      <text x="904" y="416" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">课程扩展与存储</text>
      <text x="904" y="442" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#ffffff">多课程知识库和生产存储继续增强。</text>
    </g>
    <path fill="#faf9f5" d="M866,500 H1170 A8,8 0 0 1 1178,508 V534 A8,8 0 0 1 1170,542 H866 A8,8 0 0 1 858,534 V508 A8,8 0 0 1 866,500 Z" />
    <text x="1018" y="527" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413" font-weight="700">答辩主张：核心闭环可演示，边界说清楚</text>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 总结</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">14</text>
  </g>
</svg>
