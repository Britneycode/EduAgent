<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <image href="../images/architecture_bg.png" x="700" y="115" width="520" height="410" preserveAspectRatio="xMidYMid slice"/>
    <rect x="690" y="105" width="540" height="430" fill="#f5f4ed" fill-opacity="0.38"/>
    <rect x="0" y="0" width="1280" height="8" fill="#c96442"/>
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">系统以 LLM Wiki 为中枢，用 LangGraph 编排学习任务</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">前端体验、Agent 编排、知识检索和数据沉淀被连接成一条工程链路。</text>
  </g>
  <g id="architecture-layers">
    <g id="layer-frontend">
      <rect x="70" y="145" width="860" height="72" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
      <rect x="70" y="145" width="92" height="72" rx="8" fill="#c96442"/>
      <text x="116" y="189" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">体验层</text>
      <text x="190" y="174" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">Next.js 前端</text>
      <text x="190" y="202" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5e5d59">聊天流、资源卡片、画像页、知识 Wiki、路径与分析面板</text>
    </g>
    <g id="layer-api">
      <rect x="70" y="235" width="860" height="72" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
      <rect x="70" y="235" width="92" height="72" rx="8" fill="#1565C0"/>
      <text x="116" y="279" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">服务层</text>
      <text x="190" y="264" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">FastAPI + SSE</text>
      <text x="190" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5e5d59">对话、资源、测验、路径、分析和导出 API，支持流式体验</text>
    </g>
    <g id="layer-agent">
      <rect x="70" y="325" width="860" height="78" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
      <rect x="70" y="325" width="92" height="78" rx="8" fill="#6b8e6b"/>
      <text x="116" y="372" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">编排层</text>
      <text x="190" y="355" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">LangGraph Orchestrator</text>
      <text x="190" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5e5d59">Router、Profile、Planner 与专业 Agent 分工协作，记录节点状态</text>
    </g>
    <g id="layer-wiki">
      <rect x="70" y="421" width="860" height="78" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
      <rect x="70" y="421" width="92" height="78" rx="8" fill="#b07d62"/>
      <text x="116" y="468" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">知识层</text>
      <text x="190" y="451" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">LLM Wiki 知识中枢</text>
      <text x="190" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5e5d59">课程隔离、语义检索、知识图谱、可信来源与内容回写</text>
    </g>
    <g id="layer-data">
      <rect x="70" y="517" width="860" height="72" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
      <rect x="70" y="517" width="92" height="72" rx="8" fill="#30302e"/>
      <text x="116" y="561" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">数据层</text>
      <text x="190" y="546" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#141413" font-weight="800">数据库、向量索引与资产存储</text>
      <text x="190" y="574" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5e5d59">PostgreSQL/SQLite、Redis、MinIO 适配、本地资源与运行事件</text>
    </g>
  </g>
  <g id="right-output">
    <rect x="970" y="145" width="238" height="444" rx="8" fill="#30302e"/>
    <text x="1000" y="190" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="800">面向学习闭环输出</text>
    <line x1="1000" y1="210" x2="1168" y2="210" stroke="#faf9f5" stroke-width="1" stroke-opacity="0.35"/>
    <g id="output-1">
      <circle cx="1014" cy="254" r="7" fill="#c96442"/>
      <text x="1036" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff">个性化资源生成</text>
    </g>
    <g id="output-2">
      <circle cx="1014" cy="308" r="7" fill="#1565C0"/>
      <text x="1036" y="314" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff">可信引用与核对</text>
    </g>
    <g id="output-3">
      <circle cx="1014" cy="362" r="7" fill="#6b8e6b"/>
      <text x="1036" y="368" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff">路径动态更新</text>
    </g>
    <g id="output-4">
      <circle cx="1014" cy="416" r="7" fill="#b07d62"/>
      <text x="1036" y="422" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#ffffff">教师分析视图</text>
    </g>
    <rect x="1000" y="492" width="176" height="54" rx="8" fill="#faf9f5"/>
    <text x="1088" y="526" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#141413" font-weight="700">可运行、可观测、可沉淀</text>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 系统全景</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">04</text>
  </g>
</svg>
