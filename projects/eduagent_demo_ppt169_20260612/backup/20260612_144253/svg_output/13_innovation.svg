<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <rect x="0" y="0" width="1280" height="8" fill="#c96442"/>
    <circle cx="1070" cy="132" r="126" fill="#1565C0" fill-opacity="0.06"/>
    <circle cx="160" cy="590" r="150" fill="#c96442" fill-opacity="0.07"/>
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">创新点不是多一个聊天窗口，而是重构学习资源的生产方式</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">EduAgent 将知识、画像、Agent 和评估组合为可持续演化的学习操作系统。</text>
  </g>
  <g id="before-after">
    <text x="92" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#87867f" font-weight="700">过去</text>
    <text x="92" y="280" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="50" fill="#141413" font-weight="800">单轮问答</text>
    <text x="96" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21" fill="#5e5d59">
      <tspan x="96" dy="0">回答一次，学习状态不被理解；</tspan>
      <tspan x="96" dy="34">内容生成后，难以沉淀、评估和协同。</tspan>
    </text>
    <path d="M496,352 L710,352 L710,320 L808,384 L710,448 L710,416 L496,416 Z" fill="#c96442"/>
    <text x="650" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">升级为</text>
    <text x="862" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#c96442" font-weight="700">现在</text>
    <text x="862" y="280" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="50" fill="#141413" font-weight="800">学习中枢</text>
    <text x="866" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21" fill="#5e5d59">
      <tspan x="866" dy="0">先理解学生，再组织知识与资源；</tspan>
      <tspan x="866" dy="34">测验、错题、路径和画像确认持续回流。</tspan>
    </text>
  </g>
  <g id="impact-line">
    <line x1="96" y1="505" x2="1184" y2="505" stroke="#e8e6dc" stroke-width="2"/>
    <circle cx="210" cy="505" r="10" fill="#c96442"/>
    <circle cx="486" cy="505" r="10" fill="#1565C0"/>
    <circle cx="762" cy="505" r="10" fill="#6b8e6b"/>
    <circle cx="1038" cy="505" r="10" fill="#b07d62"/>
    <text x="210" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">学生侧个性化</text>
    <text x="486" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">教师侧洞察</text>
    <text x="762" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">知识侧沉淀</text>
    <text x="1038" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">工程侧扩展</text>
  </g>
  <g id="closing-claim">
    <rect x="252" y="602" width="776" height="50" rx="8" fill="#30302e"/>
    <text x="640" y="634" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="700">从“生成一段答案”升级为“运营一段学习过程”</text>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 创新价值</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">13</text>
  </g>
</svg>
