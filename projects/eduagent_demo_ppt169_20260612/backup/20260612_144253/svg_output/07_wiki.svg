<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <rect x="0" y="0" width="1280" height="8" fill="#c96442"/>
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">LLM Wiki 让生成内容有边界、有来源、可沉淀</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">所有 Agent 共享课程图谱、RAG 检索和内容回写机制，降低幻觉并积累知识资产。</text>
  </g>
  <g id="wiki-figure">
    <rect x="56" y="138" width="690" height="468" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <image href="../images/wiki_graph.png" x="76" y="158" width="650" height="350" preserveAspectRatio="xMidYMid slice"/>
    <rect x="76" y="158" width="650" height="350" fill="#f5f4ed" fill-opacity="0.10"/>
    <rect x="100" y="530" width="190" height="44" rx="8" fill="#30302e"/>
    <text x="195" y="558" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">课程知识图谱</text>
    <rect x="318" y="530" width="190" height="44" rx="8" fill="#30302e"/>
    <text x="413" y="558" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">向量检索片段</text>
    <rect x="536" y="530" width="166" height="44" rx="8" fill="#30302e"/>
    <text x="619" y="558" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">可信引用</text>
  </g>
  <g id="mechanism-panel">
    <rect x="786" y="138" width="438" height="468" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <text x="820" y="184" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#141413" font-weight="800">四个机制保证可信生成</text>
    <g id="mechanism-course">
      <rect x="820" y="220" width="370" height="66" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <circle cx="850" cy="253" r="14" fill="#c96442"/>
      <text x="850" y="259" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">1</text>
      <text x="880" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">课程隔离</text>
      <text x="880" y="272" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">不同课程模板、资料和图谱独立管理。</text>
    </g>
    <g id="mechanism-retrieval">
      <rect x="820" y="304" width="370" height="66" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <circle cx="850" cy="337" r="14" fill="#1565C0"/>
      <text x="850" y="343" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">2</text>
      <text x="880" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">语义检索</text>
      <text x="880" y="356" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">先检索课程片段，再交给 Agent 生成。</text>
    </g>
    <g id="mechanism-source">
      <rect x="820" y="388" width="370" height="66" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <circle cx="850" cy="421" r="14" fill="#6b8e6b"/>
      <text x="850" y="427" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">3</text>
      <text x="880" y="416" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">来源片段</text>
      <text x="880" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">资源携带 sources、confidence 和核对入口。</text>
    </g>
    <g id="mechanism-writeback">
      <rect x="820" y="472" width="370" height="66" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <circle cx="850" cy="505" r="14" fill="#b07d62"/>
      <text x="850" y="511" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">4</text>
      <text x="880" y="500" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413" font-weight="700">内容回写</text>
      <text x="880" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">高质量资源沉淀为后续可复用资产。</text>
    </g>
    <rect x="820" y="558" width="370" height="28" rx="8" fill="#30302e"/>
    <text x="1005" y="578" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">生成不是凭空回答，而是在统一知识底座上协同。</text>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | LLM Wiki 知识中枢</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">07</text>
  </g>
</svg>
