<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <rect x="0" y="0" width="1280" height="8" fill="#c96442"/>
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">学生画像从对话中生成，并驱动后续每一次资源编排</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">8 维画像把个体差异转成可执行的内容深度、题目难度和路径节奏。</text>
  </g>
  <g id="chartArea">
    <!-- chart-plot-area: radar | center: 386,386 | radius: 178 -->
    <rect x="56" y="132" width="660" height="492" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <g id="radar-grid">
      <polygon points="386,208 512,260 564,386 512,512 386,564 260,512 208,386 260,260" fill="#ffffff" stroke="#e8e6dc" stroke-width="1.5"/>
      <polygon points="386,244 487,285 528,386 487,487 386,528 285,487 244,386 285,285" fill="#f5f4ed" stroke="#e8e6dc" stroke-width="1"/>
      <polygon points="386,279 462,310 493,386 462,462 386,493 310,462 279,386 310,310" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <polygon points="386,315 436,336 457,386 436,436 386,457 336,436 315,386 336,336" fill="#f5f4ed" stroke="#e8e6dc" stroke-width="1"/>
      <polygon points="386,350 411,361 422,386 411,411 386,422 361,411 350,386 361,361" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <line x1="386" y1="386" x2="386" y2="208" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="512" y2="260" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="564" y2="386" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="512" y2="512" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="386" y2="564" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="260" y2="512" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="208" y2="386" stroke="#e8e6dc" stroke-width="1.2"/>
      <line x1="386" y1="386" x2="260" y2="260" stroke="#e8e6dc" stroke-width="1.2"/>
    </g>
    <g id="radar-data">
      <polygon points="386,226 486,286 546,386 479,479 386,510 282,490 244,386 274,274" fill="#c96442" fill-opacity="0.22" stroke="#c96442" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="386" cy="226" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="486" cy="286" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="546" cy="386" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="479" cy="479" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="386" cy="510" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="282" cy="490" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="244" cy="386" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
      <circle cx="274" cy="274" r="5" fill="#ffffff" stroke="#c96442" stroke-width="3"/>
    </g>
    <g id="radar-labels">
      <text x="386" y="190" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">知识基础</text>
      <text x="536" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">认知风格</text>
      <text x="580" y="392" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">学习目标</text>
      <text x="532" y="532" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">易错点</text>
      <text x="386" y="594" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">学习节奏</text>
      <text x="198" y="532" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">兴趣</text>
      <text x="112" y="392" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">编程能力</text>
      <text x="164" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#141413" font-weight="700">时间投入</text>
    </g>
  </g>
  <g id="rule-panel">
    <rect x="760" y="132" width="464" height="492" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <text x="794" y="180" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#141413" font-weight="800">画像如何驱动个性化</text>
    <g id="rule-1">
      <rect x="794" y="218" width="386" height="76" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <rect x="794" y="218" width="8" height="76" rx="4" fill="#c96442"/>
      <text x="826" y="250" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#141413" font-weight="700">讲解深度</text>
      <text x="826" y="276" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">基础弱先补前置概念，目标强则加入高阶拓展。</text>
    </g>
    <g id="rule-2">
      <rect x="794" y="314" width="386" height="76" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <rect x="794" y="314" width="8" height="76" rx="4" fill="#1565C0"/>
      <text x="826" y="346" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#141413" font-weight="700">题目难度</text>
      <text x="826" y="372" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">根据易错点、目标和节奏调整测验结构。</text>
    </g>
    <g id="rule-3">
      <rect x="794" y="410" width="386" height="76" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <rect x="794" y="410" width="8" height="76" rx="4" fill="#6b8e6b"/>
      <text x="826" y="442" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#141413" font-weight="700">资源形式</text>
      <text x="826" y="468" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">偏视觉给导图/动画，偏实践给代码/实验。</text>
    </g>
    <g id="rule-4">
      <rect x="794" y="506" width="386" height="76" rx="8" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
      <rect x="794" y="506" width="8" height="76" rx="4" fill="#b07d62"/>
      <text x="826" y="538" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#141413" font-weight="700">路径节奏</text>
      <text x="826" y="564" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5e5d59">结合每周学习时间和测验结果推进节点状态。</text>
    </g>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 8 维学习画像</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">08</text>
  </g>
</svg>
