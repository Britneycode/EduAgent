<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#f5f4ed"/>
    <rect x="0" y="0" width="1280" height="8" fill="#c96442"/>
  </g>
  <g id="header">
    <text x="56" y="68" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" fill="#141413" font-weight="800">演示链路覆盖学生学习闭环，过程完整可复现</text>
    <text x="56" y="101" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">学习结果会反哺错题、路径、仪表盘和助教干预，而不是停留在聊天窗口。</text>
  </g>
  <g id="loop-visual">
    <rect x="56" y="132" width="744" height="492" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <image href="../images/learning_loop.png" x="76" y="152" width="704" height="452" preserveAspectRatio="xMidYMid slice"/>
    <rect x="76" y="152" width="704" height="452" fill="#f5f4ed" fill-opacity="0.14"/>
    <circle cx="428" cy="378" r="162" fill="#f5f4ed" fill-opacity="0.76" stroke="#e8e6dc" stroke-width="2" stroke-dasharray="8,6"/>
    <circle cx="428" cy="378" r="92" fill="#30302e"/>
    <text x="428" y="365" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="800">学习闭环</text>
    <text x="428" y="398" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#ffffff">生成、练习、反馈、更新</text>
  </g>
  <g id="stages">
    <g id="stage-profile">
      <circle cx="428" cy="216" r="38" fill="#c96442"/>
      <text x="428" y="211" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">01</text>
      <text x="428" y="236" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">画像</text>
    </g>
    <g id="stage-resource">
      <circle cx="555" cy="277" r="38" fill="#1565C0"/>
      <text x="555" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">02</text>
      <text x="555" y="297" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">资源</text>
    </g>
    <g id="stage-quiz">
      <circle cx="586" cy="416" r="38" fill="#6b8e6b"/>
      <text x="586" y="411" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">03</text>
      <text x="586" y="436" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">测验</text>
    </g>
    <g id="stage-mistake">
      <circle cx="498" cy="529" r="38" fill="#c4a35a"/>
      <text x="498" y="524" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">04</text>
      <text x="498" y="549" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">错题</text>
    </g>
    <g id="stage-path">
      <circle cx="358" cy="529" r="38" fill="#b07d62"/>
      <text x="358" y="524" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">05</text>
      <text x="358" y="549" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">路径</text>
    </g>
    <g id="stage-eval">
      <circle cx="270" cy="416" r="38" fill="#1565C0"/>
      <text x="270" y="411" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">06</text>
      <text x="270" y="436" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">评估</text>
    </g>
    <g id="stage-teacher">
      <circle cx="301" cy="277" r="38" fill="#30302e"/>
      <text x="301" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">07</text>
      <text x="301" y="297" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#ffffff">教师</text>
    </g>
  </g>
  <g id="right-script">
    <rect x="836" y="132" width="388" height="492" rx="8" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
    <text x="870" y="180" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#141413" font-weight="800">答辩演示脚本</text>
    <text x="870" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5e5d59">以“反向传播算法”为例，跑通完整链路。</text>
    <line x1="870" y1="246" x2="1184" y2="246" stroke="#e8e6dc" stroke-width="1.5"/>
    <text x="870" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#141413">
      <tspan x="870" dy="0">1. 登录后自然语言说明基础与目标</tspan>
      <tspan x="870" dy="34">2. 生成画像并触发资源计划</tspan>
      <tspan x="870" dy="34">3. 产出讲义、测验、代码和导图</tspan>
      <tspan x="870" dy="34">4. 测验结果进入错题与复习队列</tspan>
      <tspan x="870" dy="34">5. 路径节点与学习分析自动更新</tspan>
      <tspan x="870" dy="34">6. 分析页查看学习效果与 Agent 链路</tspan>
    </text>
    <rect x="870" y="540" width="314" height="46" rx="8" fill="#30302e"/>
    <text x="1027" y="569" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">每个环节都有页面、数据和 Agent 事件支撑</text>
  </g>
  <g id="footer">
    <text x="56" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">EduAgent | 学习闭环演示</text>
    <text x="1224" y="690" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#87867f">10</text>
  </g>
</svg>
