# EduAgent 正式 HTTPS 配置
# 证书路径对应 certbot 签发的 xwz0219.top 证书

# 80 端口：ACME 验证 + 强制跳转 HTTPS
server {
    listen 80;
    server_name xwz0219.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：正式服务
server {
    listen 443 ssl;
    http2 on;
    server_name xwz0219.top;

    ssl_certificate     /etc/letsencrypt/live/xwz0219.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xwz0219.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 20m;

    # 后端 API（含 SSE 流式接口）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应必需：关闭缓冲、放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
