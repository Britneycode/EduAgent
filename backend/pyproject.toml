[project]
name = "eduagent-backend"
version = "0.1.0"
description = "EduAgent 后端服务"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "numpy>=1.26,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.15.0",
    "langgraph>=1.0,<2.0",
    "redis>=5.0,<7.0",
    "chromadb-client>=0.5,<1.0",
    "pypdf>=6.10.2",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
